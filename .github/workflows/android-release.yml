name: Signed Android release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release version and signing key
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(version);
          if (!match) throw new Error('Expected stable tag vMAJOR.MINOR.PATCH');
          const [major, minor, patch] = match.slice(1).map(Number);
          const code = major * 1000000 + minor * 1000 + patch;
          if (minor > 999 || patch > 999 || code < 1 || code > 2100000000) throw new Error('Version out of range');
          for (const key of ['KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']) {
            if (!process.env[key]) throw new Error('Missing signing secret: ' + key);
          }
          const keyPath = process.env.RUNNER_TEMP + '/distribution.jks';
          fs.writeFileSync(keyPath, Buffer.from(process.env.KEYSTORE_BASE64, 'base64'), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\nRELEASE_CODE=${code}\nANDROID_KEYSTORE_PATH=${keyPath}\n`);
          JS
      - name: Test, lint and build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew :core:domain:test :app:lintRelease :app:assembleRelease -PreleaseVersionName="$RELEASE_VERSION" -PreleaseVersionCode="$RELEASE_CODE"
      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk --clobber
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.jks"
